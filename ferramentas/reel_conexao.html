<!doctype html><html><head><meta charset="utf-8"><style>
/*FONTS*/
:root{--carbon:#15171A;--ink:#1C1E21;--silver:#C4C8CE;--pos-d:#6FBF93}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;font-family:Barlow;-webkit-font-smoothing:antialiased;background:#000}
.shot{position:absolute;inset:0;overflow:hidden;display:none}
.shot img{position:absolute;left:50%;top:50%;width:1080px;height:1920px;object-fit:cover;transform-origin:50% 50%}
.shot .fr{display:none}
#shade{position:absolute;inset:0;z-index:100;background:radial-gradient(ellipse 120% 38% at 50% 50%,rgba(0,0,0,.34) 0%,rgba(0,0,0,0) 70%),linear-gradient(to bottom,rgba(0,0,0,.25) 0%,rgba(0,0,0,0) 18%,rgba(0,0,0,0) 72%,rgba(0,0,0,.45) 100%)}
#flash{position:absolute;inset:0;z-index:101;background:#fff;opacity:0}
.cap{z-index:102;position:absolute;left:90px;right:90px;top:50%;text-align:center;color:#fff;display:none;transform-origin:50% 50%}
.cap p{font-weight:700;font-size:84px;line-height:1.16;text-shadow:0 4px 28px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.35);letter-spacing:-.005em}
.cap p.q{font-style:italic;font-weight:600}
.cap mark{white-space:nowrap;background:#fff;color:var(--carbon);padding:0 .16em;box-decoration-break:clone;-webkit-box-decoration-break:clone;text-shadow:none}
.cap mark.g{background:var(--pos-d);color:var(--carbon)}
.cap .small{display:inline-block;margin-top:40px;font-family:BarlowC;font-weight:700;font-size:38px;letter-spacing:.22em;text-transform:uppercase;padding:16px 30px;background:var(--carbon);color:#fff;text-shadow:none}
#handle{z-index:103;position:absolute;left:0;right:0;bottom:470px;text-align:center;font-family:BarlowC;font-weight:800;font-size:44px;letter-spacing:.12em;color:#fff;opacity:0;text-shadow:0 2px 12px rgba(0,0,0,.5)}
</style></head><body>
<div id="shots"></div>
<div id="shade"></div>
<div id="flash"></div>
<div id="caps"></div>
<div id="handle">@EUSOUJULIANO</div>
<script>
const R = /*REEL*/;
const cl = x => Math.min(Math.max(x,0),1);
const ease = x => 1 - Math.pow(1 - cl(x), 3);
const back = x => { x = cl(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const md = s => esc(s).replace(/\[\[g:(.+?)\]\]/g,'<mark class="g">$1</mark>').replace(/\[\[(.+?)\]\]/g,'<mark>$1</mark>');
const SH = R.shots, CP = R.caps;
const sEnd = i => SH[i+1] ? SH[i+1].start : R.duration;

document.getElementById('shots').innerHTML = SH.map((s, i) =>
  `<div class="shot" id="h${i}">${s.frames ? s.frames.map(f => `<img class="fr" src="${f}">`).join('') : `<img src="${s.img}">`}</div>`).join('');
document.getElementById('caps').innerHTML = CP.map((c, i) =>
  `<div class="cap" id="c${i}"><p class="${c.quote?'q':''}">${md(c.text)}</p>${c.small ? `<span class="small">${esc(c.small)}</span>` : ''}</div>`).join('');

async function ready(){ await Promise.all([...document.images].map(i => i.decode().catch(()=>{}))); return true; }
function fit(){ render(0); }

const eio = x => { x = cl(x); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x+2, 3)/2; };
const TD = s => s.tr ? (s.td || (s.tr === 'dissolve' ? .5 : .42)) : 0;

// geometry of one shot for a given transition role: 'in' (arriving) or 'out' (leaving), q in 0..1
function trans(kind, role, q){
  const e = eio(q), blur = Math.sin(Math.PI * q) * 26;
  let x = 0, y = 0, s = 1, o = 1, b = 0;
  if (kind === 'whipL') { x = role === 'in' ? (1-e)*1080 : -e*1080; b = blur; }
  else if (kind === 'whipR') { x = role === 'in' ? -(1-e)*1080 : e*1080; b = blur; }
  else if (kind === 'whipU') { y = role === 'in' ? (1-e)*1920 : -e*1920; b = blur; }
  else if (kind === 'zoom') { if (role === 'out') { s = 1 + .7*e; o = 1 - e; b = blur*.8; } else { s = 1.3 - .3*e; o = e; b = (1-e)*18; } }
  else if (kind === 'dissolve') { if (role === 'in') o = e; }
  return {x, y, s, o, b};
}

function render(t){
  SH.forEach((s, i) => {
    const st = s.start, en = sEnd(i), n = document.getElementById('h' + i);
    const tdIn = TD(s), nx = SH[i+1], tdOut = nx ? TD(nx) : 0;
    const from = st - tdIn;
    const on = t >= from && t < en;
    n.style.display = on ? 'block' : 'none';
    if (!on) return;
    n.style.zIndex = i;
    let g = {x:0, y:0, s:1, o:1, b:0};
    if (tdIn && t < st) g = trans(s.tr, 'in', (t - from) / tdIn);
    else if (tdOut && t >= en - tdOut) g = trans(nx.tr, 'out', (t - (en - tdOut)) / tdOut);
    n.style.opacity = g.o;
    n.style.filter = g.b > .5 ? `blur(${g.b.toFixed(1)}px)` : 'none';
    n.style.transform = `translate(${g.x}px, ${g.y}px) scale(${g.s})`;
    const p = cl((t - from) / (en - from));
    if (s.frames) {
      const fr = n.querySelectorAll('.fr'); const k = Math.min(fr.length - 1, Math.max(0, Math.floor((t - from) * 30 * (s.speed || 1))));
      const z = s.kb ? s.kb[0] + (s.kb[1]-s.kb[0]) * p : 1.02 + .05*p;
      fr.forEach((f, j) => { f.style.display = j === k ? 'block' : 'none'; f.style.transform = `translate(-50%,-50%) scale(${z})`; });
    } else {
      const kb = s.kb || [1.05, 1.15, 0, 0, 0, -24];
      const sc = kb[0] + (kb[1]-kb[0]) * p, x = kb[2] + (kb[3]-kb[2]) * p, y = kb[4] + (kb[5]-kb[4]) * p;
      const punch = s.tr ? 1 : 1 + .035 * (1 - ease((t - st) / .22));
      n.querySelector('img').style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(${sc * punch})`;
    }
  });
  // white flash on marked cuts
  let fl = 0; SH.forEach(s => { if (s.flash) fl = Math.max(fl, 1 - cl((t - s.start) / .14)) * (t >= s.start ? 1 : 0); });
  document.getElementById('flash').style.opacity = fl * .55;
  CP.forEach((c, i) => {
    const n = document.getElementById('c' + i);
    const L = R.cap_lead || 0, cs = c.start === 0 ? 0 : c.start - L, ce = c.end >= R.duration ? c.end : c.end - L;
    const on = t >= cs && t < ce;
    n.style.display = on ? 'block' : 'none';
    if (!on) return;
    const q = c.start === 0 ? 1 : back((t - cs) / .24);
    const o = c.start === 0 ? 1 : cl((t - cs) / .12);
    const y = c.y || 0;
    n.style.opacity = o;
    n.style.transform = `translateY(calc(-50% + ${y}px)) scale(${.9 + .1*q})`;
  });
  const h = R.handle_from != null ? cl((t - R.handle_from) / .4) : 0;
  document.getElementById('handle').style.opacity = h;
}
</script></body></html>
